[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-news-collector"
version = "0.1.0"
description = "RSS to AI summaries to Notion collector for semiconductor industry news."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Study" }]
dependencies = [
  "feedparser>=6.0.11",
  "openai>=1.99.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "requests-mock>=1.12.1",
]

[project.scripts]
semi-news = "semi_news_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
